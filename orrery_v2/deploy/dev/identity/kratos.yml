version: v1.3.1
dsn: postgres://kratos:kratos-development-password@kratos-postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:5178
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:5178/
  allowed_return_urls:
    - http://127.0.0.1:5178
  methods:
    password:
      enabled: true
    oidc:
      enabled: true
      config:
        base_redirect_uri: http://127.0.0.1:4433
        providers:
          - id: feishu
            provider: lark
            client_id: ${ORRERY_FEISHU_APP_ID}
            client_secret: ${ORRERY_FEISHU_APP_SECRET}
            mapper_url: file:///etc/config/kratos/feishu.jsonnet
            scope: []
    profile:
      enabled: false
  flows:
    error:
      ui_url: http://127.0.0.1:5178/login
    login:
      ui_url: http://127.0.0.1:5178/login
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:5178/login
    registration:
      enabled: false
      ui_url: http://127.0.0.1:5178/login
    settings:
      ui_url: http://127.0.0.1:5178/login

log:
  level: info
  format: text

secrets:
  cookie:
    - orrery-development-cookie-secret-change-me
  cipher:
    - orrery-dev-cipher-secret-1234567

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
