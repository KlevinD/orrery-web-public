version: v1.3.1
dsn: memory

serve:
  public:
    base_url: http://127.0.0.1:4433/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:5178/
  allowed_return_urls:
    - http://127.0.0.1:5178
  methods:
    password:
      enabled: true
    oidc:
      enabled: true
      config:
        base_redirect_uri: http://127.0.0.1:4433
        providers:
          - id: feishu
            provider: lark
            client_id: configured-by-environment
            client_secret: configured-by-environment
            mapper_url: file:///etc/config/kratos/feishu.jsonnet
            scope: []
  flows:
    error:
      ui_url: http://127.0.0.1:5178/login
    login:
      ui_url: http://127.0.0.1:5178/login
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:5178/login
    registration:
      enabled: false
      ui_url: http://127.0.0.1:5178/login
    settings:
      ui_url: http://127.0.0.1:5178/login

log:
  level: info
  format: json

secrets:
  cookie:
    - replace-with-at-least-32-byte-cookie-secret
  cipher:
    - replace-with-exactly-32-byte-key

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
