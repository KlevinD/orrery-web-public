map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $orrery_cache_control {
    default "no-store";
    ~^/_app/immutable/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    etag off;
    if_modified_since off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $orrery_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        proxy_pass http://orrery-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /mcp {
        proxy_pass http://orrery-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /_app/immutable/ {
        try_files $uri =404;
    }

    location = /_app/version.json {
        try_files $uri =404;
    }

    location = /service-worker.js {
        try_files $uri =404;
    }

    location / {
        try_files ${uri}.html $uri $uri/ /index.html;
    }
}
