  pathItems:
    DevelopmentSubmissionAction:
      parameters:
        - $ref: "#/components/parameters/TodoID"
        - $ref: "#/components/parameters/DevelopmentSubmissionID"
      post:
        parameters:
          - $ref: "#/components/parameters/IfMatchVersion"
          - $ref: "#/components/parameters/IdempotencyKeyHeader"
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevelopmentSubmissionActionRequest" }
        responses:
          "200":
            description: Updated code submission.
            content:
              application/json:
                schema: { $ref: "#/components/schemas/TodoCodeSubmissionDTO" }
  parameters:
    AgentRunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    WebsiteKnowledgeProposalID:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdempotencyKey:
