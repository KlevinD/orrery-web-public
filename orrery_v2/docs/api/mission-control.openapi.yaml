      - { name: todo_id, in: path, required: true, schema: { type: string } }
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteTodoAttachment
      summary: Remove an unsubmitted attachment from an open human Todo
      responses:
        '204': { description: Attachment removed }
    get:
      operationId: downloadTodoAttachment
      summary: Download an attachment with current Todo read authorization
      responses:
        '200':
          description: Attachment bytes; private, no-store, forced download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
