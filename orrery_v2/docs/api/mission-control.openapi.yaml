  schemas:
    OntologyGroundedExactSupport:
      type: object
      additionalProperties: false
      required: [assertion_ref, version]
      properties:
        assertion_ref: {type: string, minLength: 1, maxLength: 256}
        version: {type: string, minLength: 1, maxLength: 256}
    OntologyGroundingCandidate:
      type: object
      additionalProperties: false
      required: [id]
      description: At least one dependency is required. All declared requirements must be supported. Host verifies dependencies, not arbitrary natural-language claim alignment.
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        required_claims: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 256}}
        required_supports: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/OntologyGroundedExactSupport'}}
    OntologyGroundedContextRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, root_id, rules]
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 256}
        root_id: {type: string, minLength: 1, maxLength: 256}
        rules: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/OntologyInferenceRule'}}
        candidates: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OntologyGroundingCandidate'}}
    OntologyGroundedProof:
      type: object
      description: Proofs are OR alternatives. Claims and supports inside one proof are AND requirements.
      properties:
        rule_id: {type: string}
        rule_version: {type: string}
        claims: {type: array, items: {type: string}}
        supports: {type: array, items: {$ref: '#/components/schemas/OntologyGroundedExactSupport'}}
    OntologyGroundedClaim:
      type: object
      required: [id, atom, state, proof_hash, proofs]
      properties:
        id: {type: string}
        atom: {$ref: '#/components/schemas/OntologyInferenceAtom'}
        state: {type: string, enum: [supported_in_snapshot]}
        proof_hash: {type: string}
        proofs: {type: array, items: {$ref: '#/components/schemas/OntologyGroundedProof'}}
    OntologyGroundedSupport:
      type: object
      required: [assertion_ref, version, id, atom, source_state]
      properties:
        assertion_ref: {type: string}
        version: {type: string}
        id: {type: string}
        atom: {$ref: '#/components/schemas/OntologyInferenceAtom'}
        source_state: {type: string, enum: [current_projection, attested_source_head]}
        source:
          type: object
          required: [root_id, provider_document_id, revision, content_hash, stamp]
          properties:
            root_id: {type: string}
            provider_document_id: {type: string}
            revision: {type: integer}
            content_hash: {type: string}
            stamp: {type: string}
        evidence_refs:
          type: array
          items:
            type: object
            required: [kind, id]
            properties:
              kind: {type: string}
              id: {type: string}
    OntologyGroundedContext:
      type: object
      required: [protocol, tenant_id, root_id, business_as_of, known_at, checked_at, semantics, rule_hash, snapshot_hash, access_hash, claims, supports, limitations, guidance]
      properties:
        protocol: {type: string, enum: [orrery.grounded-context.v1]}
        tenant_id: {type: string}
        root_id: {type: string}
        business_as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time}
        next_boundary: {type: string, format: date-time}
        semantics: {type: string}
        rule_hash: {type: string}
        snapshot_hash: {type: string}
        access_hash: {type: string}
        claims: {type: array, items: {$ref: '#/components/schemas/OntologyGroundedClaim'}}
        supports: {type: array, items: {$ref: '#/components/schemas/OntologyGroundedSupport'}}
        decisions:
          type: array
          items:
            type: object
            required: [id, eligible, reason]
            properties:
              id: {type: string}
              eligible: {type: boolean}
              reason: {type: string, enum: [all_dependencies_supported, claim_not_supported_in_snapshot, exact_support_not_current]}
        conflicts: {type: array, items: {type: object, additionalProperties: true}}
        disputed_assertions: {type: array, items: {type: object, additionalProperties: true}}
        limitations: {type: array, items: {type: string}}
        guidance: {type: string}
    OntologyInferenceAtom:
      type: object
      additionalProperties: false
      required: [kind, subject]
      properties:
        kind: {type: string, enum: [object, link, fact]}
        type: {type: string, maxLength: 256, description: Object or link type. Omit for facts.}
        subject: {type: string, minLength: 1, maxLength: 256, description: Opaque case-sensitive object ID or a variable prefixed with a question mark.}
        object: {type: string, maxLength: 256, description: Link endpoint ID or variable.}
        predicate: {type: string, maxLength: 256}
        value: {description: Literal JSON value. Only subject and object support variable binding.}
        relation_code:
          type: string
          enum: [subsidiary_of, owns, supplies, customer_of, works_for, party_to, produces, located_in, depends_on, related_to]
          description: Optional exact meaning for knowledge_entity_related_to premises. Omission matches any meaning. Forbidden in conclusions and other atom kinds.
    OntologyInferenceRule:
      type: object
      additionalProperties: false
      required: [id, version, when, then]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 128}
        when: {type: array, minItems: 1, maxItems: 6, items: {$ref: '#/components/schemas/OntologyInferenceAtom'}}
        then: {$ref: '#/components/schemas/OntologyInferenceAtom'}
    OntologyInferenceCandidate:
      type: object
      description: Structured entity, link or fact claim. Entity IDs and evidence IDs are assigned by the server for document claims. All outputs require review.
      required: [kind]
      properties:
        id: {type: string}
        kind: {type: string, enum: [entity, link, fact]}
        operation: {type: string, enum: [suggest]}
        object_type: {type: string}
        object_id: {type: string}
        canonical_key: {type: string}
        label: {type: string}
        link_type: {type: string}
        from: {$ref: '#/components/schemas/OntologyInferenceObjectRef'}
        to: {$ref: '#/components/schemas/OntologyInferenceObjectRef'}
        subject: {$ref: '#/components/schemas/OntologyInferenceObjectRef'}
        predicate: {type: string}
        value: {}
        properties: {type: object, additionalProperties: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        reason: {type: string}
        evidence_refs:
          type: array
          items: {type: object, required: [kind, id], properties: {kind: {type: string}, id: {type: string}}}
    OntologyInferenceObjectRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {type: string}
        id: {type: string}
    OntologyInferenceDocument:
      type: object
      additionalProperties: false
      required: [text, extractor_version]
      properties:
        text: {type: string, minLength: 1, description: Requester-submitted material, at most 128 KiB UTF-8. Never treated as an attested knowledge-store revision.}
        extractor_version: {type: string, minLength: 1, maxLength: 128}
        claims:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [quote, candidate]
            properties:
              quote: {type: string, minLength: 1, maxLength: 4000, description: Must occur literally in text.}
              candidate: {$ref: '#/components/schemas/OntologyInferenceCandidate'}
    OntologyInferenceRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, root_id, rules]
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 256}
        root_id: {type: string, minLength: 1, maxLength: 256}
        rules: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/OntologyInferenceRule'}}
        documents: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/OntologyInferenceDocument'}}
        previous_run_id: {type: string}
        business_as_of: {type: string, format: date-time, description: 'Business time to evaluate; requires known_at and makes the run historical and read-only.'}
        known_at: {type: string, format: date-time, description: 'What the system had recorded by this time; requires business_as_of and cannot be in the future. Current permissions apply.'}
    OntologyInferenceWorkflowRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, run_id, candidate_id, expected_revision, support_hash]
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 256}
        run_id: {type: string, minLength: 1, maxLength: 256}
        candidate_id: {type: string, minLength: 1, maxLength: 256}
        expected_revision: {type: integer, minimum: 1}
        support_hash: {type: string, minLength: 1, maxLength: 128}
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, maxLength: 2000}
        plan_id: {type: string}
        idempotency_key: {type: string, maxLength: 128}
        confirmed: {type: boolean}
    OntologyInferenceCandidateState:
      type: object
      required: [candidate_id, support_hash, revision, status, run_id, updated_at]
      properties:
        candidate_id: {type: string}
        support_hash: {type: string}
        revision: {type: integer}
        status: {type: string, enum: [proposed, approved, rejected, withdrawn, revision_required, applied]}
        run_id: {type: string}
        decision_by: {type: string}
        decision_kind: {type: string, enum: [human, agent]}
        decision_reason: {type: string}
        updated_at: {type: string, format: date-time}
        plan:
          type: object
          required: [id, actor, support_hash, authorization_hash, expires_at, link_type, from, to]
          properties:
            id: {type: string}
            actor: {type: string}
            support_hash: {type: string}
            authorization_hash: {type: string}
            expires_at: {type: string, format: date-time}
            link_type: {type: string}
            from: {$ref: '#/components/schemas/OntologyInferenceObjectRef'}
            to: {$ref: '#/components/schemas/OntologyInferenceObjectRef'}
        receipt:
          type: object
          required: [id, actor, plan_id, idempotency_key, action_run_id, link_id, applied_at]
          properties:
            id: {type: string}
            actor: {type: string}
            plan_id: {type: string}
            actor_kind: {type: string, enum: [human, agent]}
            idempotency_key: {type: string}
            action_run_id: {type: string}
            link_id: {type: string}
            applied_at: {type: string, format: date-time}
    OntologyInferenceRun:
      type: object
      required: [id, tenant_id, status, candidate_count, request]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        engine: {type: string}
        status: {type: string}
        candidate_count: {type: integer}
        rejected_candidate_count: {type: integer}
        review_required_count: {type: integer}
        context_pack_hash: {type: string}
        candidates: {type: array, items: {$ref: '#/components/schemas/OntologyInferenceCandidate'}}
        validation: {type: array, items: {type: object, additionalProperties: true}}
        proposals: {type: array, items: {type: object, additionalProperties: true}}
        current_candidates: {type: array, items: {$ref: '#/components/schemas/OntologyInferenceCandidateState'}}
        request:
          type: object
          properties:
            evaluation:
              type: object
              properties:
                root_id: {type: string}
                input_stamp: {type: string}
                support_hashes: {type: object, additionalProperties: {type: string}}
                actor_hash: {type: string}
                query_hash: {type: string}
                business_as_of: {type: string, format: date-time}
                known_at: {type: string, format: date-time}
                historical: {type: boolean, description: 'Historical results cannot enter the current candidate session or writeback.'}
                history_limitations: {type: array, items: {type: string}, description: 'Reports excluded unversioned legacy assertions, unspecified business starts, and use of current rules and permissions.'}
                next_boundary: {type: string, format: date-time, description: 'Next visible business boundary for current evaluation; crossing a boundary invalidates commit support.'}
                fact_conflicts:
                  type: array
                  description: Disputed source facts withheld from definite rule premises; original assertions remain in the authorized context.
                  items:
                    type: object
                    required: [subject_id, predicate, status]
                    properties:
                      subject_id: {type: string}
                      predicate: {type: string}
                      assertion_ids: {type: array, items: {type: string}}
                      status: {type: string, enum: [disputed]}
                rules: {type: array, items: {$ref: '#/components/schemas/OntologyInferenceRule'}}
                closure: {type: object, additionalProperties: true, description: Premise assertions, conclusions and all direct rule derivations.}
                documents: {type: array, items: {type: object, additionalProperties: true}, description: Content hashes, extractor versions and quotes. Full submitted text is not stored.}
                withdrawn_ids: {type: array, items: {type: string}}
                retained_ids: {type: array, items: {type: string}}
                revised_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OntologyInferenceSchemaExport:
      type: object
      required: [tenant_id, owl_turtle, shacl_turtle, limitations]
