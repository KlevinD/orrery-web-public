openapi: 3.1.0
info:
  title: Orrery Mission Control API
  version: 0.11.0
paths:
  /api/ontology/inference/context:
    post:
      operationId: readGroundedOntologyContext
      summary: Read current supported claims and validate explicit context dependencies
      description: Requires ontology.read and current canonical scope/source access. Recomputes a bounded two-hop authorized snapshot with assertion business time, source publication heads, conflicts and AND/OR rule proofs. Claim requirements survive an independent support replacement; exact support requirements bind assertion_ref and version. Never creates runs, proposals, decisions or writeback receipts. Local publication attestation is not upstream truth, and structural support does not prove a rule's meaning. Source/access changes during reading return conflict; clients must reread before reusing context. Raw knowledge material and historical memories are not upgraded to definite premises.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyGroundedContextRequest'}
      responses:
        '200':
          description: Current proof graph and dependency decisions. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyGroundedContext'}
        '400': {description: Invalid or empty dependency annotations, invalid rules or unsupported request fields.}
        '401': {description: Authentication required.}
        '403': {description: Current feature, scope or source access denied.}
        '404': {description: Root unavailable.}
        '409': {description: Source, policy or business boundary changed during reading; reread.}
        '503': {description: Required dependency or complete-context budget unavailable.}
  /api/diagnostics/client-errors:
    post:
      operationId: reportClientDiagnostic
      summary: Durably queue a bounded client error for the failure center
      description: Requires the current authenticated session and same-origin mutation checks. Tenant and actor are derived from the session. Reports are redacted, deduplicated by actor and client ID, and rate limited to 60 per minute per actor. Does not accept request bodies, headers, or repair instructions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientErrorReport' }
      responses:
        '202':
          description: Saved to the durable inbox; incident projection is asynchronous.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, const: queued }
        '400': { description: Invalid report or oversized payload. }
        '401': { description: Authentication required. }
        '403': { description: Origin or actor mismatch. }
        '429': { description: Rate limited; retry after 60 seconds. }
        '503': { description: Diagnostics unavailable. }
  /api/ontology/inference/review:
    post:
      operationId: reviewOntologyInferenceCandidate
      summary: Approve or reject a current inference candidate
      description: Requires an authenticated user or Agent with ontology.manage and current scope manage access. Agents decide directly from the evidence and must record a nonempty reason; human approval is not required. Rebuilds current authorized input and checks the support hash and expected candidate revision. Changed or absent support invalidates the candidate. Document claims remain advisory until attested source integration is available.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyInferenceWorkflowRequest'}
      responses:
        '200':
          description: Current candidate state with the plan or committed receipt. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyInferenceCandidateState'}
        '400': {description: Invalid workflow request or unsupported candidate type.}
        '401': {description: Authentication required.}
        '403': {description: Authenticated user or Agent with current scope manage authorization required.}
        '404': {description: Current candidate or source unavailable.}
        '409': {description: Stale candidate, changed input or permission, expired plan or different retry key.}
        '503': {description: Required dependency or input budget unavailable.}
  /api/ontology/inference/plan:
    post:
      operationId: planOntologyInferenceCandidate
      summary: Preview the exact existing-object relationship assertion
      description: Requires a user or Agent with current scope manage access and an approved candidate. The model can create and inspect this plan without human involvement. Only many-to-many relation types with suggested_allowed and allowed_actions containing ontology.derived_link.assert are executable. Plans expire after ten minutes and bind the planner, support hash and authorization revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyInferenceWorkflowRequest'}
      responses:
        '200':
          description: Current candidate state with the plan or committed receipt. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyInferenceCandidateState'}
        '400': {description: Invalid workflow request or unsupported candidate type.}
        '401': {description: Authentication required.}
        '403': {description: Authenticated user or Agent with current scope manage authorization required.}
        '404': {description: Current candidate or source unavailable.}
        '409': {description: Stale candidate, changed input or permission, expired plan or different retry key.}
        '503': {description: Required dependency or input budget unavailable.}
  /api/ontology/inference/apply:
    post:
      operationId: applyOntologyInferenceCandidate
      summary: Apply a confirmed relationship plan and return its durable receipt
      description: Requires the same user or Agent who created the plan, confirmed=true, plan_id and idempotency_key. An Agent confirms its own decision; human confirmation is not required. Reauthorizes and recomputes current support. A transaction fences current source data, Registry, scope and security revisions, then atomically saves the assertion, graph projection, ActionRun, receipt and candidate state. Records the actual Agent or human actor kind. An identical retry returns the original receipt, including after restart. Does not execute canonical business field changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyInferenceWorkflowRequest'}
      responses:
        '200':
          description: Current candidate state with the plan or committed receipt. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyInferenceCandidateState'}
        '400': {description: Invalid workflow request or unsupported candidate type.}
        '401': {description: Authentication required.}
        '403': {description: Authenticated user or Agent with current scope manage authorization required.}
        '404': {description: Current candidate or source unavailable.}
        '409': {description: Stale candidate, changed input or permission, expired plan or different retry key.}
        '503': {description: Required dependency or input budget unavailable.}
  /api/ontology/inference/evaluate:
    post:
      operationId: evaluateOntologyRules
      summary: Evaluate versioned rules and quoted document claims into review proposals
      description: Requires ontology.manage and canonical scope manage authorization. Reads a complete authorized two-hop neighborhood within 25 nodes and 100 edges. Current inference filters assertion business windows and knowledge time before conflicts and rule joins. Supplying both business_as_of and known_at creates a historical read-only run using current permissions and rules; it never updates current candidates or enters review/plan/apply. known_at cannot be in the future; historical requests must omit documents and previous_run_id. Unversioned legacy knowledge assertions are excluded with history_limitations. Previous-run comparison is restricted to the same requester and root. Returns 503 rather than a partial inference when context limits are exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyInferenceRequest'}
      responses:
        '200':
          description: Persisted run with candidates, validation, review proposals and derivation ledger. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyInferenceRun'}
        '400': {description: Invalid rules, unbound variables, fabricated quotes or mismatched previous-run scope.}
        '401': {description: Authentication required.}
        '403': {description: Feature or scope manage access denied.}
        '404': {description: Root or previous run unavailable.}
        '409': {description: Source data or current candidate session changed during evaluation; retry.}
        '503': {description: Dependency or complete-context budget unavailable.}
  /api/ontology/inference/schema-export:
    get:
      operationId: exportOntologyReasoningSchema
      summary: Export scoped Registry definitions as OWL and SHACL Turtle
      description: Requires ontology.read and canonical scope read authorization. The JSON sidecar preserves Orrery-specific governance metadata. Structural export does not prove OWL logical consistency.
      parameters:
        - {name: tenant_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      responses:
        '200':
          description: OWL, SHACL and Registry sidecar. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyInferenceSchemaExport'}
        '400': {description: Invalid or unresolved schema definitions.}
        '401': {description: Authentication required.}
        '403': {description: Feature or scope read access denied.}
        '503': {description: Dependency unavailable.}
  /api/business-approvals/marketing-wechat-drafts/{decision_id}:
    get:
      operationId: getMarketingWechatApprovalStatus
      summary: Read the committed Marketing approval and original resolution receipt
      description: Requires the dedicated Marketing service credential. Restricts reads to decisions owned by Marketing in the system tenant. Does not create or resolve approvals.
      parameters:
        - {name: decision_id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {name: Authorization, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative workflow status and its committed receipt when resolved.
          content:
            application/json:
              schema:
                type: object
                required: [decision_id, workflow_instance_id, status]
                properties:
                  decision_id: {type: string}
                  workflow_instance_id: {type: string}
                  status: {type: string, enum: [pending, approved, rejected, changes_requested, expired, superseded]}
                  decided_at: {type: string, format: date-time}
                  resolution: {$ref: '#/components/schemas/MarketingWechatApprovalResolution'}
        '401': {description: Dedicated service credential missing or invalid.}
        '404': {description: Decision missing or owned by another business service.}
        '409': {description: Workflow state and committed resolution receipt do not agree.}
        '503': {description: Approval status dependency unavailable.}
  /api/business-approvals/marketing-wechat-drafts:
    post:
      operationId: requestMarketingWechatDraftApproval
      description: Accepts a frozen Marketing WeChat generation and creates the dedicated seven-day formal business approval. This service endpoint requires the Marketing bearer credential and never accepts a caller-selected approver or workflow.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            pattern: '^Bearer .+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation_id, account_id, content_hash, asset_hashes, material, idempotency_key]
              properties:
                generation_id: {type: string, minLength: 1}
                submission_id: {type: string, minLength: 1, maxLength: 500, description: Immutable Marketing submission identifier. Requires project_id, content_revision and bundle_hash.}
                project_id: {type: string, minLength: 1, maxLength: 500}
                content_revision: {type: integer, minimum: 1, maximum: 2147483647}
                bundle_hash: {type: string, pattern: '^sha256:[0-9a-fA-F]{64}$'}
                supersedes_decision_id: {type: string, minLength: 1, maxLength: 500, description: Pending approval owned by Marketing for this generation and account. Replacing an approved or executing version returns conflict.}
                account_id: {type: string, minLength: 1}
                content_hash: {type: string, pattern: '^sha256:.+$'}
                asset_hashes:
                  type: array
                  items: {type: string, pattern: '^sha256:.+$'}
                material: {$ref: '#/components/schemas/MarketingWechatBusinessApprovalMaterial'}
                artifacts:
                  type: array
                  items: {$ref: '#/components/schemas/MarketingWechatBusinessApprovalArtifact'}
                evidence_refs:
                  type: array
                  items: {type: string}
                idempotency_key: {type: string, minLength: 1}
      responses:
        '201':
          description: The formal approval exists. Identical retries return the same decision and workflow identifiers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketingWechatBusinessApprovalResponse'}
        '400':
          description: The frozen generation, hashes, or readable approval material are invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: The dedicated Marketing bearer credential is missing or invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: The idempotency key or generation is already bound to different frozen content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: The service credential or approval dependency is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/health:
    get:
      operationId: getHealth
      description: Reports the API runtime readiness state without requiring authentication.
      responses:
        "200":
          description: All registered runtime readiness checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDTO"
        "503":
          description: At least one registered runtime readiness check failed or no readiness probe is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDTO"
  /api/auth/session:
    get:
      operationId: getCurrentAuthSession
      description: Restores the authoritative app session from the HttpOnly session cookie or an app-session bearer token.
      responses:
        "200":
          description: Current authenticated app session without an access token in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDTO"
        "401":
          description: Missing, expired, or revoked app session.
  /api/auth/identity/{provider}/login-flow:
    get:
      operationId: getBrowserLoginFlow
      description: Returns a bounded, sanitized browser login flow from the configured identity provider.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sanitized browser login flow.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store`.
            Vary:
              schema:
                type: string
              description: Includes `Cookie` because flow metadata is bound to the browser flow cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLoginFlow"
        "400":
          description: Invalid flow identifier or unsupported flow shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Flow cookie is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Flow was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Flow has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Identity provider is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/identity/{provider}/logout:
    get:
      operationId: beginBrowserIdentityLogout
      description: Redirects the current browser through the configured identity provider logout flow.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: return_to
          in: query
          required: false
          description: Relative Orrery path used after provider logout. Unsafe or missing values default to `/login`.
          schema:
            type: string
            default: /login
      responses:
        "303":
          description: Continue the current browser logout at the identity provider.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "400":
          description: Provider is not configured or does not support browser logout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Identity provider is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: SettingsDTO
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsDTO"
      responses:
        "200":
          description: SettingsDTO
  /api/settings/image-generation:
    get:
      operationId: getImageGenerationSettings
      description: Read platform image configuration. Requires settings.read.
      responses:
        "200":
          description: Image generation configuration; credentials are references only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsImageGenerationDTO"
    put:
      operationId: updateImageGenerationSettings
      description: Replace image configuration without changing chat settings. Requires settings.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsImageGenerationDTO"
      responses:
        "200":
          description: Saved image configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsImageGenerationDTO"
  /api/settings/image-generation/test:
    post:
      operationId: testImageGenerationConnection
      description: Check the saved gateway model catalog, without generating images or enabling the service. Requires settings.manage.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Catalog check only; generation_verified is always false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsImageConnectionTestDTO"
  /api/settings/runtime/discovery:
    get:
      operationId: discoverRuntimeCandidates
      responses:
        "200":
          description: RuntimeDiscoveryResponseDTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDiscoveryResponseDTO"
  /api/settings/knowledge/pageindex/test:
    post:
      operationId: testPageIndexConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPageIndexConnectionTestRequestDTO"
      responses:
        "200":
          description: SettingsPageIndexConnectionTestResultDTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPageIndexConnectionTestResultDTO"
  /api/settings/gateway:
    get:
      operationId: getGatewaySettings
      responses:
        "200":
          description: Redacted GatewaySettingsDTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySettingsDTO"
    put:
      operationId: updateGatewaySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewaySettingsUpdateRequest"
      responses:
        "200":
          description: Redacted GatewaySettingsDTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySettingsDTO"
  /api/settings/gateway/raw:
    put:
      operationId: updateGatewaySettingsRaw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewaySettingsRawUpdateRequest"
      responses:
        "200":
          description: Redacted GatewaySettingsDTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySettingsDTO"
  /api/settings/gateway/accounts:
    get:
      operationId: getGatewayAccounts
      responses:
        "200":
          description: Configured Gateway accounts with runtime connection health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayAccountsDTO"
  /api/settings/gateway/feishu/registrations:
    post:
      operationId: startFeishuApplicationRegistration
      description: Starts a tenant- and administrator-bound Feishu application registration session. The App Secret is saved encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFeishuRegistrationRequest"
      responses:
        "202":
          description: Feishu application registration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuRegistrationDTO"
  /api/settings/gateway/feishu/registrations/{registration_id}:
    parameters:
      - name: registration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFeishuApplicationRegistration
      responses:
        "200":
          description: Feishu application registration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuRegistrationDTO"
    delete:
      operationId: cancelFeishuApplicationRegistration
      responses:
        "200":
          description: Cancelled Feishu application registration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuRegistrationDTO"
  /api/gateway/deliveries:
    post:
      operationId: createGatewayDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayDeliveryRequestDTO"
      responses:
        "202":
          description: Durable outbound deliveries accepted for verified personal bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDeliveriesDTO"
  /api/gateway/deliveries/{delivery_id}:
    get:
      operationId: getGatewayDelivery
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped Gateway delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDeliveryDTO"
  /api/profile/gateway-bindings:
    get:
      operationId: getProfileGatewayBindings
      responses:
        "200":
          description: Current user's verified Gateway bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileGatewayBindingsDTO"
  /api/profile/personal-assistant:
    get:
      operationId: getProfilePersonalAssistant
      responses:
        "200":
          description: Current user's system assistant runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAssistantProfileDTO"
    post:
      operationId: createProfilePersonalAssistant
      responses:
        "201":
          description: Personal assistant explicitly created by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAssistantProfileDTO"
    put:
      operationId: updateProfilePersonalAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonalAssistantProfileRequest"
      responses:
        "200":
          description: Updated current-user system assistant runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAssistantProfileDTO"
  /api/profile/personal-assistant/notifications:
    get:
      operationId: getProfilePersonalAssistantNotifications
      responses:
        "200":
          description: Current user's private personal assistant notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAssistantNotificationPreferencesDTO"
    put:
      operationId: updateProfilePersonalAssistantNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonalAssistantNotificationsRequest"
      responses:
        "200":
          description: Updated current-user personal assistant notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAssistantNotificationPreferencesDTO"
  /api/profile/personal-assistant/audio/speech:
    post:
      operationId: synthesizePersonalAssistantSpeech
      description: Read aloud a persisted assistant reply in the authenticated owner's private conversation. Does not send channel messages or execute another assistant turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversation_id, message_id]
              properties:
                conversation_id: { type: string }
                message_id: { type: string }
                voice: { type: string }
      responses:
        "200":
          description: Private MP3 audio. Cache-Control is private, no-store.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400": { description: Invalid message, voice or content length }
        "401": { description: Authentication required }
        "403": { description: Conversation is not owned by the caller }
        "404": { description: Conversation or assistant message not found }
        "503": { description: Speech synthesis is not configured }
  /api/profile/personal-assistant/audio/transcriptions:
    post:
      operationId: transcribePersonalAssistantAudio
      description: Transcribe an existing audio attachment in the authenticated owner's private conversation. Never executes an approval or sends a conversation turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversation_id, attachment_id]
              properties:
                conversation_id: { type: string }
                attachment_id: { type: string }
                language: { type: string }
      responses:
        "200":
          description: Voice-derived text; approval requires separate explicit confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [text, input_modality, approval_confirmation_required]
                properties:
                  text: { type: string }
                  input_modality: { type: string, enum: [voice] }
                  approval_confirmation_required: { type: boolean, enum: [true] }
        "400": { description: Invalid attachment or empty transcription }
        "401": { description: Authentication required }
        "403": { description: Conversation is not owned by the caller }
        "404": { description: Conversation or attachment not found }
        "503": { description: Speech recognition is not configured }
  /api/profile/personal-assistant/avatar:
    get:
      operationId: getProfilePersonalAssistantAvatar
      responses:
        "200":
          description: Current user's private personal assistant avatar
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Avatar has not changed
    put:
