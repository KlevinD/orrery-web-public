name: Bug report
description: Report a reproducible problem in the Orrery Web/API source.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, private logs or exploit details.
        Use the private security channel described in `SECURITY.md` for vulnerabilities.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the problem
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Go version, Node version and the relevant commit.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
