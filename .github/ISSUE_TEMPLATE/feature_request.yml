name: Feature request
description: Propose a focused improvement to the Orrery Web/API source.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user or operator problem first. Do not include credentials or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and its boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
